# =============================================================================
# SIS-CHAVE — Pipeline GitLab CI/CD
# =============================================================================
#
# Variáveis obrigatórias no GitLab (Settings → CI/CD → Variables):
#   VM_DEV_HOST       — IP ou hostname da VM de desenvolvimento
#   VM_DEV_USER       — usuário SSH na VM (ex: deploy)
#   VM_DEV_SSH_KEY    — chave SSH privada (tipo: File, masked)
#
# Variáveis automáticas do GitLab (não configurar):
#   CI_REGISTRY, CI_REGISTRY_USER, CI_REGISTRY_PASSWORD, CI_REGISTRY_IMAGE
#   CI_COMMIT_SHORT_SHA
# =============================================================================

stages:
  - test
  - build
  - deploy

variables:
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"
  DOCKER_BUILDKIT: "1"

# ── TESTES ────────────────────────────────────────────────────────────────────

test:backend:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:15-alpine
      alias: postgres
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpass
    # Injetadas no Django via settings
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: testuser
    DB_PASSWORD: testpass
    DB_NAME: test_db
    SECRET_KEY: "ci-insecure-key-only-for-tests"
    DJANGO_DEBUG: "True"
    CORS_ALLOW_ALL: "True"
  script:
    - cd sistema-controle-chaves/backend
    - pip install --no-cache-dir -r requirements.txt
    - python manage.py migrate
    - python manage.py test app.tests --verbosity=2
  rules:
    # Roda em MRs e nas branches principais
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── BUILD ─────────────────────────────────────────────────────────────────────
# Só builda após merge em develop — nunca em MRs abertas

build:backend:
  stage: build
  image: docker:24-cli
  services:
    - docker:24-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build
        -t "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
        -t "$BACKEND_IMAGE:latest"
        sistema-controle-chaves/backend
    - docker push "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$BACKEND_IMAGE:latest"
  needs:
    - test:backend
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

build:frontend:
  stage: build
  image: docker:24-cli
  services:
    - docker:24-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # VITE_API_URL vazio = URLs relativas → nginx faz proxy para o backend
    - docker build
        --build-arg VITE_API_URL=""
        -t "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
        -t "$FRONTEND_IMAGE:latest"
        -f sistema-controle-chaves/frontend/Dockerfile.homolog
        sistema-controle-chaves/frontend
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$FRONTEND_IMAGE:latest"
  needs:
    - test:backend
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

# ── DEPLOY ────────────────────────────────────────────────────────────────────
# A VM nunca faz git pull nem docker build.
# A pipeline envia o compose file via scp e executa docker compose pull + up.

deploy:vm-dev:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    # VM_DEV_SSH_KEY deve ser do tipo "File" no GitLab para preservar as quebras de linha
    - chmod 400 "$VM_DEV_SSH_KEY"
    - ssh-add "$VM_DEV_SSH_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$VM_DEV_HOST" >> ~/.ssh/known_hosts
  script:
    # 1. Envia o compose file atualizado para a VM
    - scp sistema-controle-chaves/docker-compose.homolog.yml
        "$VM_DEV_USER@$VM_DEV_HOST:~/sischave/docker-compose.homolog.yml"

    # 2. Na VM: autentica no registry, puxa as novas imagens e sobe os containers
    - |
      ssh "$VM_DEV_USER@$VM_DEV_HOST" "
        set -e
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

        export BACKEND_IMAGE=$BACKEND_IMAGE
        export FRONTEND_IMAGE=$FRONTEND_IMAGE
        export IMAGE_TAG=$CI_COMMIT_SHORT_SHA

        cd ~/sischave
        docker compose -f docker-compose.homolog.yml pull
        docker compose -f docker-compose.homolog.yml up -d --remove-orphans

        # Remove imagens antigas para economizar disco
        docker image prune -f
      "
  environment:
    name: development
    url: "http://$VM_DEV_HOST"
  needs:
    - build:backend
    - build:frontend
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
